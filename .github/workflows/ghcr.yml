name: Publish image to GHCR

on:
  push:
    # The prepare job selects the repository's default branch, including forks
    # whose default branch is not named main.
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare image metadata
    if: >-
      github.event.deleted != true && (
        github.event_name == 'workflow_dispatch' ||
        github.ref_type == 'tag' ||
        github.ref_name == github.event.repository.default_branch
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Resolve image name and application version
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # GHCR requires a lowercase image name; never publish to an upstream
          # namespace copied from the original Docker Hub workflows.
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'image=ghcr.io/%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != v* || ! "$GITHUB_REF_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              printf '::error::Version tags must start with v and be valid container image tags.\n'
              exit 1
            fi
            printf 'version=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'version=sha-%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ steps.image.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

  build:
    name: Build linux/${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Write application version
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$APP_VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf '::error::The build did not return a valid image digest.\n'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: ghcr-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge digests and publish tags
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image }}
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          first_tag=''
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(--tag "$tag")
            [[ -n "$first_tag" ]] || first_tag="$tag"
          done <<< "$IMAGE_TAGS"
          if [[ -z "$first_tag" ]]; then
            printf '::error::No image tags were generated.\n'
            exit 1
          fi

          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            digest="${file##*/}"
            if [[ ! -f "$file" || ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              printf '::error::Invalid image digest artifact.\n'
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            printf '::error::Both amd64 and arm64 builds must finish before publishing.\n'
            exit 1
          fi
          # Merge this run's exact digests, never mutable per-architecture tags.
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          {
            printf '### Published GHCR image\n\n'
            printf '```text\n%s\n```\n\n' "$IMAGE_TAGS"
            printf '```text\n'
            docker buildx imagetools inspect "$first_tag"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
