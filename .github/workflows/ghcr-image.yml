# Builds the backend image and publishes it to GitHub Container Registry as
# ghcr.io/herta-network/new-api. Fork-owned: the upstream Docker Hub
# workflows (docker-build.yml, docker-image-branch.yml) are left unchanged.
#
# Tags:
#   push to main          main, sha-<7>
#   push of tag v1.2.3    v1.2.3, v1.2, latest, sha-<7>
#   push of tag v1.2.3-x  v1.2.3-x, sha-<7>  (prereleases do not move v1.2 or latest)
#   manual run            the selected branch or tag, as above (other branches
#                         get <branch>, with / and other symbols turned into -)
#
# VERSION (common.Version, shown by /api/status): the tag name for tag builds;
# for branch builds <base>-<branch>.<7-char sha>, where <base> is the VERSION
# file, else the nearest v* tag, else v0.0.0.
#
# Build: each platform compiles new-api on its own native runner, with Go from
# go.mod and the module and build caches kept between runs by setup-go, and
# passes the binary to the Dockerfile as the context named builder. That
# context replaces the Dockerfile's builder stage, so BuildKit runs only the
# runtime stage. The Build binary step must match the builder stage: when the
# Dockerfile changes its Go version, environment, -pgo or -ldflags, change the
# step too.
name: Publish GHCR image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  IMAGE: ghcr.io/herta-network/new-api

jobs:
  prepare:
    name: Resolve version and tags
    if: github.repository == 'Herta-Network/new-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
      metadata: ${{ steps.meta.outputs.json }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full commit history and tags without trees or blobs, for git describe.
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Resolve VERSION
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release=false
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
            if printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              release=true
            fi
          else
            base=$(tr -d '[:space:]' < VERSION)
            if [ -z "$base" ]; then
              base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            fi
            branch=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^-+//; s/-+$//')
            version="${base}-${branch}.${GITHUB_SHA::7}"
          fi
          # The Dockerfile passes VERSION to go build inside -ldflags quotes.
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._+-]*$'; then
            echo "::error::Unsupported version string: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release)"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        # latest marks vX.Y.Z tags only. A prerelease renders every semver
        # pattern as {{version}}, so the v belongs in prefix, not in the pattern.
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ steps.version.outputs.release }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The Dockerfile's builder stage, run on the runner. The Docker build
      # has no .git, hence -buildvcs=false.
      - name: Build binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOEXPERIMENT: greenteagc
        run: |
          pgo="$(go list -m -f '{{.Dir}}' github.com/MoeForge/moejs)/default.pgo"
          mkdir -p "$RUNNER_TEMP/builder/build"
          go build -buildvcs=false -pgo="$pgo" \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" \
            -o "$RUNNER_TEMP/builder/build/new-api"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder context replaces the Dockerfile's builder stage, so
      # COPY --from=builder /build/new-api takes the binary built above. Only
      # the runtime stage's layers are cached; the binary's changes every run.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-contexts: builder=${{ runner.temp }}/builder
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=ghcr-runtime-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: ghcr-digest-*
          merge-multiple: true

      # imagetools only talks to the registry, so the runner's preinstalled
      # buildx serves without setting up a builder.
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ needs.prepare.outputs.metadata }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$METADATA")
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::No image tags were resolved"
            exit 1
          fi
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<< "$METADATA")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::No platform digests were downloaded"
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" \
            --metadata-file "$RUNNER_TEMP/manifest.json" "${sources[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### $IMAGE"
            echo
            echo "Version: \`$VERSION\`"
            echo
            echo "Digest: \`$digest\`"
            echo
            jq -r '.tags[] | "- `" + . + "`"' <<< "$METADATA"
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
